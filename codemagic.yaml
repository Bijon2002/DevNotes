workflows:
  # 1. Fast Debug Build (Zero environment variables required)
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      webhook:
        url: https://webhook.site/3ae66662-3f5c-429a-990e-9e2e8775bb7c
        only_if_build_successful: false

  # 2. Production Signed Release Build (Requires Codemagic 'android_signing' group)
  android-release:
    name: Android Release Signed Build
    max_build_duration: 30
    environment:
      groups:
        - android_signing
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Decode Keystore from Environment Variable
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/release.keystore
      - name: Build Signed Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      webhook:
        url: https://webhook.site/3ae66662-3f5c-429a-990e-9e2e8775bb7c
        only_if_build_successful: false
